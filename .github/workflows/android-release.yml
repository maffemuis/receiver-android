name: Publish signed Android release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v3.7.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      RIDGUARD_KEYSTORE_PASSWORD: ${{ secrets.RIDGUARD_KEYSTORE_PASSWORD }}
      RIDGUARD_KEY_ALIAS: ${{ secrets.RIDGUARD_KEY_ALIAS }}
      RIDGUARD_KEY_PASSWORD: ${{ secrets.RIDGUARD_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            Android/*.gradle
            Android/app/*.gradle
            Android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Validate release secrets
        env:
          RIDGUARD_KEYSTORE_BASE64: ${{ secrets.RIDGUARD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          for value in RIDGUARD_KEYSTORE_BASE64 RIDGUARD_KEYSTORE_PASSWORD RIDGUARD_KEY_ALIAS RIDGUARD_KEY_PASSWORD; do
            if [ -z "${!value:-}" ]; then
              echo "Missing required GitHub Actions secret: $value"
              exit 1
            fi
          done

      - name: Restore signing keystore
        env:
          RIDGUARD_KEYSTORE_BASE64: ${{ secrets.RIDGUARD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$RIDGUARD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ridguard-release.jks"
          chmod 600 "$RUNNER_TEMP/ridguard-release.jks"
          echo "RIDGUARD_KEYSTORE_PATH=$RUNNER_TEMP/ridguard-release.jks" >> "$GITHUB_ENV"

      - name: Make Gradle wrapper executable
        run: chmod +x Android/gradlew

      - name: Test and build signed release APK
        working-directory: Android
        run: ./gradlew testReleaseUnitTest assembleRelease --stacktrace

      - name: Prepare release files
        run: |
          set -euo pipefail
          mkdir -p dist
          cp Android/app/build/outputs/apk/release/app-release.apk dist/RID-Guard.apk
          (cd dist && sha256sum RID-Guard.apk > RID-Guard.apk.sha256)

      - name: Verify APK signature
        run: apksigner verify --verbose --print-certs dist/RID-Guard.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/RID-Guard.apk dist/RID-Guard.apk.sha256 --clobber
          else
            gh release create "$RELEASE_TAG" \
              dist/RID-Guard.apk \
              dist/RID-Guard.apk.sha256 \
              --title "RID Guard $RELEASE_TAG" \
              --generate-notes \
              --target "$GITHUB_SHA"
          fi
