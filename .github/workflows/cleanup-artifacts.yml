name: Cleanup old Actions artifacts

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/cleanup-artifacts.yml'
  schedule:
    - cron: '23 3 * * 0'

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete artifacts older than 3 days
        uses: actions/github-script@v7
        with:
          script: |
            const retentionDays = 3;
            const cutoff = Date.now() - retentionDays * 24 * 60 * 60 * 1000;
            const artifacts = [];

            for (let page = 1; ; page += 1) {
              const response = await github.rest.actions.listArtifactsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
                page,
              });
              artifacts.push(...response.data.artifacts);
              if (response.data.artifacts.length < 100) break;
            }

            let deleted = 0;
            let deletedBytes = 0;
            for (const artifact of artifacts) {
              const createdAt = Date.parse(artifact.created_at);
              if (Number.isNaN(createdAt) || createdAt >= cutoff) continue;

              try {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
                deleted += 1;
                deletedBytes += artifact.size_in_bytes || 0;
                core.info(`Deleted ${artifact.name} (${artifact.id})`);
              } catch (error) {
                if (error.status === 404 || error.status === 410) {
                  core.info(`Artifact ${artifact.id} was already removed or expired.`);
                  continue;
                }
                throw error;
              }
            }

            core.notice(`Deleted ${deleted} artifact(s), approximately ${(deletedBytes / 1024 / 1024).toFixed(1)} MiB.`);
