name: Android test build

on:
  push:
    branches:
      - master
      - "agent/**"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: android-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mark Android build pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending \
            -f context='rid-guard/android-build' \
            -f description='Android tests and APK build are running'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            Android/*.gradle
            Android/app/*.gradle
            Android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle wrapper executable
        run: chmod +x Android/gradlew

      - name: Run unit tests
        working-directory: Android
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build test APK
        working-directory: Android
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp Android/app/build/outputs/apk/debug/app-debug.apk dist/RID-Guard-test.apk
          sha256sum dist/RID-Guard-test.apk > dist/RID-Guard-test.apk.sha256

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: RID-Guard-test-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Mark Android build successful
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=success \
            -f context='rid-guard/android-build' \
            -f description='Tests passed and RID-Guard-test.apk was built'

      - name: Mark Android build failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=failure \
            -f context='rid-guard/android-build' \
            -f description='Android tests or APK build failed'
