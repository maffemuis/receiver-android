name: Android test build

on:
  push:
    branches:
      - master
      - "agent/**"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: android-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mark Android build pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending \
            -f context='rid-guard/android-build' \
            -f description='Android tests and APK build are running' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            Android/*.gradle
            Android/app/*.gradle
            Android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore test signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ridguard-test-debug-keystore-v1

      - name: Create test signing key when missing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=RID Guard Test,O=RID Guard,C=NL"
          fi
          keytool -list \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey

      - name: Make Gradle wrapper executable
        run: chmod +x Android/gradlew

      - name: Run unit tests
        working-directory: Android
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build test APK
        working-directory: Android
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp Android/app/build/outputs/apk/debug/app-debug.apk dist/RID-Guard-test.apk
          (cd dist && sha256sum RID-Guard-test.apk > RID-Guard-test.apk.sha256)

      - name: Verify test APK signature
        run: apksigner verify --verbose --print-certs dist/RID-Guard-test.apk

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: RID-Guard-test-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Mark Android build successful
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=success \
            -f context='rid-guard/android-build' \
            -f description='Tests passed and RID-Guard-test.apk was built' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Mark Android build failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=failure \
            -f context='rid-guard/android-build' \
            -f description='Android tests or APK build failed' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
